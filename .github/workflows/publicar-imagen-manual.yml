name: Publicar imagen ms-ventas (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STREAMING_ENABLED: "false"
      KAFKA_PUBLISHER_ENABLED: "false"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
      SPRING_KAFKA_ADMIN_AUTO_CREATE: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "127.0.0.1:1"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Ejecutar pruebas locales disponibles
        run: mvn -B test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publicar imagen por commit
        id: imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agrocenter-ms-ventas:sha-${{ github.sha }}
      - name: Registrar digest
        env:
          IMAGE_DIGEST: ${{ steps.imagen.outputs.digest }}
        run: |
          printf 'Digest de imagen para registrar: %s\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
