name: Publicar imagen ms-ventas por commit

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    name: Publicar imagen sin despliegue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: docker/setup-buildx-action@v3
      
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agrocenter-ms-ventas:sha-${{ github.sha }}
