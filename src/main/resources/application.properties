server.port=${SERVER_PORT:8082}
spring.application.name=ms-ventas

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_ventas}}
spring.datasource.username=${DB_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

agrocenter.security.jwt.issuer-uri=${COGNITO_ISSUER_URI:http://localhost:9999/mock-cognito}
agrocenter.security.jwt.jwk-set-uri=${COGNITO_JWK_SET_URI:http://localhost:9999/mock-cognito/.well-known/jwks.json}
agrocenter.security.jwt.audience=${COGNITO_AUDIENCE:agrocenter-api}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:http://localhost:9999/mock-cognito}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${COGNITO_JWK_SET_URI:http://localhost:9999/mock-cognito/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.audiences=${COGNITO_AUDIENCE:agrocenter-api}

agrocenter.inventory.base-url=${INVENTORY_SERVICE_URL:${MS_INVENTARIO_URL:http://localhost:8081}}
agrocenter.inventory.connect-timeout=${INVENTORY_CONNECT_TIMEOUT:2s}
agrocenter.inventory.read-timeout=${INVENTORY_READ_TIMEOUT:3s}
agrocenter.inventory.service-token=${INVENTORY_SERVICE_TOKEN:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

server.error.include-stacktrace=never
server.error.include-message=never
spring.jackson.time-zone=UTC
